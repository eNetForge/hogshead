version: 2
project_name: hogshead
builds:
  - main: ./cmd/hogshead
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/enetforge/hogshead/internal/version.Version={{.Version}}
archives:
  # No version in the file name, so the newest build always has the same URL:
  # https://github.com/eNetForge/hogshead/releases/latest/download/hogshead_linux_amd64.tar.gz
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [LICENSE, README.md, compose.yaml]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  use: github
  sort: asc
